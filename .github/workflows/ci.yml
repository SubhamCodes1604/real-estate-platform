name: Final Project Tests

on:
  push:
    branches: [main, QA]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Django checks and tests
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      GEMINI_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install Django djangorestframework django-cors-headers djangorestframework-simplejwt python-dotenv google-genai Pillow openpyxl

      - name: Run Django system checks
        run: python manage.py check

      - name: Check for unapplied model changes
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend test suite
        run: python manage.py test --verbosity 2

  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production frontend
        run: npm run build
